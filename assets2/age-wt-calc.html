<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neonatal Classifier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }
        
        .classifier-section {
            margin-bottom: 30px;
        }
        
        .classifier-section:last-child {
            margin-bottom: 0;
        }
        
        h2 {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .classification {
            min-width: 200px;
            padding: 12px 14px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            white-space: nowrap;
        }
        
        .classification.empty {
            color: #999;
            font-style: italic;
        }
        
        .note {
            margin-top: 30px;
            padding: 15px;
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            font-size: 12px;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Neonatal Classifier</h1>
        
        <div class="classifier-section">
            <h2>Gestational Age</h2>
            <div class="input-group">
                <input type="number" id="gaInput" placeholder="Enter weeks" min="0" max="50" step="0.1">
                <div class="classification empty" id="gaClassification">—</div>
            </div>
        </div>
        
        <div class="classifier-section">
            <h2>Birth Weight</h2>
            <div class="input-group">
                <input type="number" id="bwInput" placeholder="Enter grams" min="0" max="5000" step="1">
                <div class="classification empty" id="bwClassification">—</div>
            </div>
        </div>
        
        <div class="note">
            <strong>Note:</strong> Postmenstrual age (PMA) or Postconceptual age (PCA) is Gestational age (at birth) + Chronological age (days since birth).
        </div>
    </div>
    
    <script>
        const gaInput = document.getElementById('gaInput');
        const gaClassification = document.getElementById('gaClassification');
        const bwInput = document.getElementById('bwInput');
        const bwClassification = document.getElementById('bwClassification');
        
        function classifyGestationalAge(weeks) {
            if (weeks === '' || weeks === null) {
                return '';
            }
            
            const w = parseFloat(weeks);
            
            if (w >= 37) return 'Full Term Neonate';
            if (w >= 34) return 'Late Preterm';
            if (w >= 32) return 'Moderate Preterm';
            if (w >= 28) return 'Very Preterm';
            if (w >= 25) return 'Extremely Preterm';
            if (w > 0) return 'Micro Preterm';
            
            return '';
        }
        
        function classifyBirthWeight(grams) {
            if (grams === '' || grams === null) {
                return '';
            }
            
            const g = parseFloat(grams);
            
            if (g < 750) return 'Micro preemie';
            if (g < 1000) return 'Extremely Low Birth Weight (ELBW)';
            if (g < 1500) return 'Very Low Birth Weight (VLBW)';
            if (g < 2500) return 'Low Birth Weight (LBW)';
            if (g > 0) return 'Normal Birth Weight';
            
            return '';
        }
        
        function updateGAClassification() {
            const classification = classifyGestationalAge(gaInput.value);
            if (classification) {
                gaClassification.textContent = classification;
                gaClassification.classList.remove('empty');
            } else {
                gaClassification.textContent = '—';
                gaClassification.classList.add('empty');
            }
        }
        
        function updateBWClassification() {
            const classification = classifyBirthWeight(bwInput.value);
            if (classification) {
                bwClassification.textContent = classification;
                bwClassification.classList.remove('empty');
            } else {
                bwClassification.textContent = '—';
                bwClassification.classList.add('empty');
            }
        }
        
        gaInput.addEventListener('input', updateGAClassification);
        bwInput.addEventListener('input', updateBWClassification);
    </script>
</body>
</html>
